<!DOCTYPE html>
<html>
<head>
    <title>我的行事曆</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #4285f4;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #357abd;
        }
        .events {
            margin-top: 20px;
        }
        .event {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .event h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .event p {
            margin: 5px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>我的行事曆</h1>
        <div>
            <a href="{{ url_for('add_event') }}" class="btn">新增事件</a>
            <a href="{{ url_for('logout') }}" class="btn" style="background-color: #dc3545;">登出</a>
        </div>
    </div>

    <div class="events">
        {% if events %}
            {% for event in events %}
            <div class="event">
                <h3>{{ event.title }}</h3>
                <p>📅 日期：{{ event.date }}</p>
                <p>⏰ 時間：{{ event.time }}</p>
                {% if event.description %}
                <p>📝 描述：{{ event.description }}</p>
                {% endif %}
            </div>
            {% endfor %}
        {% else %}
            <p style="text-align: center; color: #666;">目前沒有任何事件</p>
        {% endif %}
    </div>
</body>
</html>
