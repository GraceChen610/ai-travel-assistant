<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊行程郵件服務</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #preview-image {
            max-width: 100%;
            margin-top: 10px;
            display: none;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }
        .loading {
            display: none;
            margin-top: 10px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>旅遊行程郵件服務</h2>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="image">選擇行程圖片：</label>
                <input type="file" id="image" accept="image/*" required>
            </div>
            <div class="form-group">
                <img id="preview-image" alt="Image preview">
            </div>
            <div class="form-group">
                <label for="email">收件人信箱：</label>
                <input type="email" id="email" required placeholder="example@example.com">
            </div>
            <button type="submit" class="btn" id="submitBtn">上傳圖片並發送</button>
        </form>
        
        <div id="loading" class="loading">處理中，請稍候...</div>
        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const preview = document.getElementById('preview-image');

        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) { // 5MB limit
                    alert('圖片大小不能超過 5MB');
                    this.value = '';
                    preview.style.display = 'none';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const imageFile = document.getElementById('image').files[0];
            const email = document.getElementById('email').value;

            if (!imageFile || !email) {
                resultDiv.className = 'error';
                resultDiv.textContent = '請填寫所有必要欄位';
                return;
            }

            submitBtn.disabled = true;
            loading.style.display = 'block';
            resultDiv.style.display = 'none';
            
            try {
                const reader = new FileReader();
                reader.readAsDataURL(imageFile);
                
                reader.onload = async function() {
                    try {
                        const response = await fetch('/send_mail', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                image: reader.result,
                                email: email
                            })
                        });
                        
                        const result = await response.json();
                        resultDiv.style.display = 'block';
                        
                        if (result.success) {
                            resultDiv.className = 'success';
                            resultDiv.textContent = '郵件發送成功！';
                            form.reset();
                            preview.style.display = 'none';
                        } else {
                            resultDiv.className = 'error';
                            resultDiv.textContent = `發送失敗：${result.error}`;
                        }
                    } catch (error) {
                        resultDiv.style.display = 'block';
                        resultDiv.className = 'error';
                        resultDiv.textContent = `錯誤：${error.message}`;
                    } finally {
                        submitBtn.disabled = false;
                        loading.style.display = 'none';
                    }
                };
            } catch (error) {
                submitBtn.disabled = false;
                loading.style.display = 'none';
                resultDiv.style.display = 'block';
                resultDiv.className = 'error';
                resultDiv.textContent = `錯誤：${error.message}`;
            }
        });
    </script>
</body>
</html>
