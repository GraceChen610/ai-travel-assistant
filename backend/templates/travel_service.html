<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Route Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .day-container {
            border: 1px solid #ddd;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
        }
        .flight-info {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input {
            width: 200px;
            padding: 5px;
        }
        .attraction-list {
            margin-top: 10px;
        }
        .attraction-item {
            background-color: #f5f5f5;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .add-btn { background-color: #4CAF50; color: white; }
        .delete-btn { background-color: #ff4444; color: white; }
        .plan-btn { background-color: #2196F3; color: white; }
        .add-day-btn { background-color: #9c27b0; color: white; }
        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>旅遊行程規劃</h1>
    <div id="daysContainer"></div>
    <button class="btn add-day-btn" onclick="addDay()">新增天數</button>
    <button class="btn plan-btn" onclick="planRoute()">規劃行程</button>
    <div id="result"></div>

    <script>
        let days = [];

        function createDayStructure(dayNumber) {
            return {
                day: dayNumber,
                departure_flight: null,
                attractions: []
            };
        }

        function addDay() {
            const dayNumber = days.length + 1;
            days.push(createDayStructure(dayNumber));
            displayAllDays();
        }

        function addFlight(dayIndex) {
            const day = days[dayIndex];
            const name = document.getElementById(`flight-name-${dayIndex}`).value;
            const latitude = parseFloat(document.getElementById(`flight-lat-${dayIndex}`).value);
            const longitude = parseFloat(document.getElementById(`flight-lng-${dayIndex}`).value);
            const arrival_time = document.getElementById(`flight-time-${dayIndex}`).value;

            if (!name || isNaN(latitude) || isNaN(longitude) || !arrival_time) {
                alert('請填寫完整的航班資訊');
                return;
            }

            day.departure_flight = { name, latitude, longitude, arrival_time };
            displayAllDays();
        }

        function addAttraction(dayIndex) {
            const name = document.getElementById(`attraction-name-${dayIndex}`).value;
            const latitude = parseFloat(document.getElementById(`attraction-lat-${dayIndex}`).value);
            const longitude = parseFloat(document.getElementById(`attraction-lng-${dayIndex}`).value);

            if (!name || isNaN(latitude) || isNaN(longitude)) {
                alert('請填寫完整的景點資訊');
                return;
            }

            days[dayIndex].attractions.push({ name, latitude, longitude });
            displayAllDays();
        }

        function removeFlight(dayIndex) {
            days[dayIndex].departure_flight = null;
            displayAllDays();
        }

        function removeAttraction(dayIndex, attractionIndex) {
            days[dayIndex].attractions.splice(attractionIndex, 1);
            displayAllDays();
        }

        function createDayStructure(dayNumber) {
    return {
        day: dayNumber,
        departure_flight: dayNumber === 1 ? null : undefined,  // Only first day has departure_flight
        attractions: []
    };
}

        function displayAllDays() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            days.forEach((day, dayIndex) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-container';
                
                // Day header
                dayDiv.innerHTML = `<h2>第 ${day.day} 天</h2>`;

                // Only show flight information for first day
                if (dayIndex === 0) {
                    const flightSection = document.createElement('div');
                    flightSection.className = 'flight-info';
                    if (!day.departure_flight) {
                        flightSection.innerHTML = `
                            <h3>航班資訊</h3>
                            <div class="form-group">
                                <label>機場代碼:</label>
                                <input type="text" id="flight-name-${dayIndex}" placeholder="例如: TPE">
                            </div>
                            <div class="form-group">
                                <label>緯度:</label>
                                <input type="number" id="flight-lat-${dayIndex}" step="any">
                            </div>
                            <div class="form-group">
                                <label>經度:</label>
                                <input type="number" id="flight-lng-${dayIndex}" step="any">
                            </div>
                            <div class="form-group">
                                <label>抵達時間:</label>
                                <input type="time" id="flight-time-${dayIndex}">
                            </div>
                            <button class="btn add-btn" onclick="addFlight(${dayIndex})">新增航班</button>
                        `;
                    } else {
                        flightSection.innerHTML = `
                            <h3>航班資訊</h3>
                            <p>機場: ${day.departure_flight.name}</p>
                            <p>位置: ${day.departure_flight.latitude}, ${day.departure_flight.longitude}</p>
                            <p>抵達時間: ${day.departure_flight.arrival_time}</p>
                            <button class="btn delete-btn" onclick="removeFlight(${dayIndex})">刪除航班</button>
                        `;
                    }
                    dayDiv.appendChild(flightSection);
                }
                // Attractions section
                const attractionsSection = document.createElement('div');
                attractionsSection.innerHTML = `
                    <h3>景點資訊</h3>
                    <div class="form-group">
                        <label>景點名稱:</label>
                        <input type="text" id="attraction-name-${dayIndex}" placeholder="例如: 台北101">
                    </div>
                    <div class="form-group">
                        <label>緯度:</label>
                        <input type="number" id="attraction-lat-${dayIndex}" step="any">
                    </div>
                    <div class="form-group">
                        <label>經度:</label>
                        <input type="number" id="attraction-lng-${dayIndex}" step="any">
                    </div>
                    <button class="btn add-btn" onclick="addAttraction(${dayIndex})">新增景點</button>
                `;

                // Display existing attractions
                day.attractions.forEach((attraction, attrIndex) => {
                    attractionsSection.innerHTML += `
                        <div class="attraction-item">
                            <div class="attraction-info">
                                <strong>${attraction.name}</strong><br>
                                緯度: ${attraction.latitude}<br>
                                經度: ${attraction.longitude}
                            </div>
                            <button class="btn delete-btn" onclick="removeAttraction(${dayIndex}, ${attrIndex})">刪除</button>
                        </div>
                    `;
                });

                dayDiv.appendChild(attractionsSection);
                container.appendChild(dayDiv);
            });
        }

        async function planRoute() {
            if (days.length === 0) {
                alert('請至少新增一天行程');
                return;
            }

            try {
                const response = await fetch('/plan_route', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(days)
                });

                const result = await response.json();
                const resultDiv = document.getElementById('result');
                
                if (result.success) {
                    resultDiv.innerHTML = '<h3>規劃結果:</h3><pre>' + 
                        JSON.stringify(result.data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<h3>錯誤:</h3><pre>' + 
                        JSON.stringify(result.error, null, 2) + '</pre>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = 
                    '<h3>Error:</h3>' + error.message;
            }
        }

        // Initialize with one day
        addDay();
    </script>
</body>
</html>
